name: Network Security Digest

on:
  schedule:
    - cron: '0 6 * * *'   # daily digest, 06:00 UTC (the only scheduled run)
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily (full digest) or hourly (urgent only)'
        type: choice
        options:
          - daily
          - hourly
        default: daily
      hours:
        description: 'Look-back window in hours'
        type: string
        default: '24'
      dry_run:
        description: 'Print the digest without opening a PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_HOURS: ${{ inputs.hours }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            MODE=daily; HOURS=24; MIN_CRIT=0
          else
            MODE="${INPUT_MODE:-daily}"; HOURS="${INPUT_HOURS:-24}"; MIN_CRIT=0
          fi
          {
            echo "mode=$MODE"
            echo "hours=$HOURS"
            echo "min_crit=$MIN_CRIT"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$MODE hours=$HOURS min_critical=$MIN_CRIT"

      - name: Build digest
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}
          DIGEST_EFFORT: ${{ vars.DIGEST_EFFORT }}
          DIGEST_MAX_ITEMS: ${{ vars.DIGEST_MAX_ITEMS }}
          MODE: ${{ steps.mode.outputs.mode }}
          HOURS: ${{ steps.mode.outputs.hours }}
          MIN_CRIT: ${{ steps.mode.outputs.min_crit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          ARGS=(--hours "$HOURS" --edition "$MODE" --min-critical "$MIN_CRIT")
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          python collector/run.py "${ARGS[@]}"
          code=$?
          if [ "$code" -eq 78 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing urgent in this window - no PR opened."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review PR
        if: steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%d-%H%M)"
          DAY="$(date -u +%Y-%m-%d)"
          BRANCH="digest/$STAMP-$MODE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/_posts data/seen.json data/last_run.json
          git commit -m "digest($MODE): network device security digest $DAY"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Digest ($MODE): network device security - $DAY" \
            --body-file digest_summary.txt \
            --label digest \
            --label needs-review \
            --base "$BASE" \
            --head "$BRANCH"

      - name: Upload digest artifact
        if: always()
        continue-on-error: true   # artifact quota must never fail a digest run
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            docs/_posts/
            digest_summary.txt
          if-no-files-found: ignore
          retention-days: 14
