title: Network Infrastructure Cybersecurity
# A project page is served under /<repo-name>/, so baseurl must match the repo name
# or every generated link resolves to the wrong path. Clear both if you ever move
# the site to a user page (omidznlp.github.io) or a custom domain.
url: "https://omidznlp.github.io"
baseurl: "/network-security-news"
description: >-
  Daily security intelligence for network devices — firewalls, VPN gateways, routers,
  switches, wireless controllers and load balancers. Filtered, triaged and turned into
  concrete upgrade and hardening actions.
theme: jekyll-theme-minimal
show_downloads: false
markdown: kramdown
permalink: /:year/:month/:day/:title/
defaults:
  - scope: {path: "", type: "posts"}
    values: {layout: "post"}
exclude: [README.md]

# GitHub Pages runs these without any build step of ours:
#   jekyll-feed    -> /feed.xml      so readers can subscribe instead of remembering to visit
#   jekyll-sitemap -> /sitemap.xml   so search engines can index every edition
#   jekyll-seo-tag -> <meta> tags    so shared links show a title and description
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

author: Omidznlp
twitter:
  card: summary
